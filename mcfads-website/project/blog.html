<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog - Mcfads Global Link</title>
<style>
  :root{ --ink:#0E1220; --panel:#171C2E; --amber:#F2A73B; --text:#E7E9F5; --soft:#9AA3C0; --line:rgba(255,255,255,0.10); }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--ink); color:var(--text); font-family:'Inter',system-ui,sans-serif; line-height:1.7;}
  .wrap{max-width:820px; margin:0 auto; padding:40px 24px;}
  a{color:var(--amber); text-decoration:none;}
  h1{font-size:32px; margin:0 0 8px;}
  .top{margin-bottom:28px;}
  .card{display:block; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:20px; color:inherit;}
  .card:hover{border-color:var(--amber);}
  .card img{width:100%; max-height:260px; object-fit:cover; display:block;}
  .card .body{padding:18px 22px;}
  .card h2{margin:0 0 6px; font-size:21px;}
  .meta{color:var(--soft); font-size:13.5px; margin-bottom:8px;}
  .cover{width:100%; border-radius:12px; margin:8px 0 20px;}
  .post p{margin:0 0 18px; font-size:16.5px;}
  .empty{color:var(--soft); padding:30px 0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/">&larr; Back to site</a></div>
  <div id="root">Loading...</div>
</div>
<script>
  var root = document.getElementById('root');

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }
  function fmtDate(d) {
    if (!d) return '';
    return new Date(d).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function renderList(posts) {
    var html = '<h1>Blog</h1><div class="meta" style="margin-bottom:24px;">News and updates from Mcfads Global Link</div>';
    if (!posts.length) {
      html += '<div class="empty">No posts yet. Check back soon.</div>';
    }
    posts.forEach(function (p) {
      html += '<a class="card" href="blog.html?slug=' + encodeURIComponent(p.slug) + '">';
      if (p.coverImage) html += '<img src="' + esc(p.coverImage) + '" alt="">';
      html += '<div class="body"><h2>' + esc(p.title) + '</h2>';
      html += '<div class="meta">' + esc(fmtDate(p.publishedAt)) + '</div>';
      html += '<div>' + esc(p.excerpt) + '</div></div></a>';
    });
    root.innerHTML = html;
  }

  function renderPost(p) {
    var paras = String(p.content).split(/\n{2,}/).map(function (t) {
      return '<p>' + esc(t).replace(/\n/g, '<br>') + '</p>';
    }).join('');
    var html = '<a href="blog.html">&larr; All posts</a><div class="post"><h1 style="margin-top:16px;">' + esc(p.title) + '</h1>';
    html += '<div class="meta">' + esc(fmtDate(p.publishedAt)) + '</div>';
    if (p.coverImage) html += '<img class="cover" src="' + esc(p.coverImage) + '" alt="">';
    html += paras + '</div>';
    root.innerHTML = html;
    document.title = p.title + ' - Mcfads Global Link';
  }

  var slug = new URLSearchParams(window.location.search).get('slug');
  var url = slug ? '/api/blog?slug=' + encodeURIComponent(slug) : '/api/blog';
  fetch(url)
    .then(function (r) { if (!r.ok) throw new Error('nf'); return r.json(); })
    .then(function (data) { if (slug) renderPost(data); else renderList(data); })
    .catch(function () {
      root.innerHTML = '<a href="blog.html">&larr; All posts</a><div class="empty">Sorry, that post could not be loaded.</div>';
    });
</script>
</body>
</html>
